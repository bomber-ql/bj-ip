<style>
        /* 仅针对404页面主体内容的样式 */
        .error-page {
            min-height: calc(100vh - 160px); /* 减去头部和底部高度预留空间 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        
        .error-content {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        
        .error-number {
            font-size: 120px;
            font-weight: 800;
            color: #333;
            margin-bottom: 20px;
            line-height: 1;
            letter-spacing: -5px;
        }
        
        .error-message {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #555;
        }
        
        .error-details {
            font-size: 16px;
            color: #777;
            margin-bottom: 36px;
            line-height: 1.6;
            padding: 0 20px;
        }
        
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }
        
        .action-button {
            display: inline-block;
            padding: 10px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .primary-btn {
            background-color: #000000;
            color: white;
            border: none;
        }
        
        .primary-btn:hover {
            background-color: #000000;
        }
        
        .secondary-btn {
            background-color: transparent;
            color: #000000;
            border: 1px solid #000000;
        }
        
        .secondary-btn:hover {
            background-color: #f0f7ff;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .error-number {
                font-size: 90px;
            }
            
            .error-message {
                font-size: 20px;
            }
            
            .error-details {
                font-size: 14px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .action-button {
                width: 80%;
                box-sizing: border-box;
            }
        }

        /* 覆盖 blog.css 里同名的 .error-message，避免粉色提示框串到 404 页 */
        .error-page .error-message {
            background: transparent;
            border: none;
            padding: 0;
            color: #ffffff;
        }
        .error-page .primary-btn { background-color: #ffffff; color: #000000; }
        .error-page .secondary-btn { color: #ffffff; border: 1px solid #ffffff; }
        .error-page .error-number { color: rgba(255,255,255,0.9); }
    </style>
</head>
